  api: pixeltable-cloud-control-plane
  title: Invalid request
  body: 'Bad Request : Invalid request: 1 validation error for PxtOperation'
  envelope: 'plain text: "<Status> : <detail>"'
  remediation: 'Not a GraphQL endpoint. The host validates every path against an internal PxtOperation model
    and rejects unrecognised shapes.'
  method: probed
rfc9457_conformance:
  conforms: false
