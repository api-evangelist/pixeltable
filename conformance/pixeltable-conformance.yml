  name: Model Context Protocol
  conforms: true
  version: '2025-06-18'
  evidence: 'POST https://pixeltable.com/mcp returned HTTP 200 to an anonymous JSON-RPC 2.0 tools/list with
    real inputSchema per tool, and to initialize with serverInfo pixeltable-web 1.0.0 and protocolVersion
    2025-06-18.'
  artifact: mcp/pixeltable-mcp.yml
- id: a2a
  name: Agent2Agent Protocol
  conforms: true
  version: 0.3.0
  grade: conformant
  evidence: 'https://www.pixeltable.com/.well-known/agent-card.json returned HTTP 200 with an agent card that
