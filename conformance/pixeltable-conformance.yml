method: probed
source: 'live probes of the Pixeltable agent surfaces plus provider documentation'
note: 'Which cross-cutting standards Pixeltable actually conforms to. This provider is an outlier: it conforms
  to the NEWER agent-era specifications (MCP, A2A, llms.txt, Agent Skills) while conforming to almost none of
  the classic HTTP API standards, because it publishes no REST API yet. Every `conforms: true` below was
  established by a live probe, not by a provider claim.'
standards:
