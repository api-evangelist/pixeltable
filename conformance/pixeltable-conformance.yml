- id: schema-org
  name: schema.org structured data
  conforms: true
  evidence: '/ask results are schema.org-typed; the homepage carries WebSite structured data; the provider
    publishes a schema-map.xml.'
- id: rfc8615-well-known
  name: RFC 8615 well-known URIs
  conforms: true
  evidence: 'Six real documents served under /.well-known/ across two hosts (two agent cards, two MCP server
    cards, a capability manifest, an agent skill).'
  artifact: well-known/pixeltable-well-known.yml
- id: openapi
  name: OpenAPI
  conforms: false
  evidence: 'https://pixeltable.com/openapi.json returns HTTP 200 but its body is
    {"status":"planned","message":"Public Pixeltable Cloud REST API OpenAPI spec is in active development."} —
    an honest placeholder, not a spec. No OpenAPI/Swagger document was found on any host, including
    /openapi.yaml, /swagger.json, /v1/openapi.json, /api-docs, /docs and /redoc on the apex, docs and
    internal-api hosts.'
- id: asyncapi
  name: AsyncAPI
  conforms: false
  evidence: '/asyncapi.yaml 404s on the apex and docs hosts. No event, streaming or webhook catalogue is
    published; webhooks appear only as an Enterprise-tier "custom integrations (API / webhooks)" bullet on the
    pricing page. Not applicable rather than deficient — there is no public event surface to describe.'
- id: graphql
  name: GraphQL
  conforms: false
  evidence: 'No GraphQL surface. /graphql 404s on the apex host, /api/graphql returns 401
    no_session_cookie_provided (the generic control-plane gate, not a GraphQL endpoint), and
    internal-api.pixeltable.com/graphql returns 400 "Invalid request: 1 validation error for PxtOperation".'
- id: rfc9457-problem-details
  name: RFC 9457 Problem Details
  conforms: false
  evidence: 'No response used Content-Type application/problem+json and no body carried
    type/title/status/detail/instance. Four different error envelope shapes are in use across the surfaces.'
  artifact: errors/pixeltable-problem-types.yml
- id: oauth2
  name: OAuth 2.0
  conforms: false
  evidence: 'No OAuth surface is exposed. /.well-known/oauth-authorization-server and
    /.well-known/oauth-protected-resource both 404 on every host. The provider states scoped OAuth is planned
    for the forthcoming public REST API. Cloud auth today is a WorkOS AuthKit session (WorkOS implements OAuth
    internally, but Pixeltable exposes no OAuth endpoints of its own).'
- id: oidc
  name: OpenID Connect
  conforms: false
  evidence: /.well-known/openid-configuration 404s on every host.
- id: rfc9116-security-txt
  name: RFC 9116 security.txt
  conforms: false
