    an array.'
  artifact: a2a/pixeltable-a2a.yml
- id: json-rpc-2.0
  name: JSON-RPC 2.0
  conforms: true
  evidence: The WebMCP endpoint accepts and returns well-formed JSON-RPC 2.0 envelopes (verified on tools/list
