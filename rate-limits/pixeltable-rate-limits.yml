retry_guidance:
  method: searched
  source: https://pixeltable.com/status
  published: 'On 429 or 5xx, retry with exponential backoff: start at ~1s and double each attempt (1s, 2s, 4s,
    8s), capped at ~30s, with jitter. Stop after 5 attempts. Treat 4xx other than 429 as non-retryable; fix the
    request instead of retrying.'
  initial_delay: ~1s
  multiplier: 2
  cap: ~30s
  jitter: true
  max_attempts: 5
  retryable_statuses:
  - 429
  - 5xx
  non_retryable: 4xx other than 429
  note: 'This is unusually good agent guidance for a provider with no OpenAPI — a documented back-off
    algorithm is exactly what an autonomous client needs, and most catalogued providers do not publish one.'
