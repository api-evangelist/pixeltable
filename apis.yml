apis:
- aid: pixeltable-webmcp
  name: Pixeltable WebMCP Server
  description: 'Read-only Model Context Protocol server served over HTTP at the Pixeltable apex host. Protocol
    version 2025-06-18, JSON-RPC 2.0 (initialize, tools/list, tools/call). Exposes two tools: search_docs,
    which searches Pixeltable documentation by topic and returns documentation URLs, and list_integrations,
    which enumerates the AI providers and tools that integrate with Pixeltable. The server mutates no state
    and answered tools/list anonymously when probed.'
  humanURL: https://docs.pixeltable.com/libraries/mcp
  baseURL: https://pixeltable.com/mcp
  tags:
  - MCP
  - Agent Tools
  - Documentation Search
  tags_raw:
  - Model Context Protocol
  - Agent Tools
  - Documentation Search
  properties:
  - type: MCPServer
    url: mcp/pixeltable-mcp.yml
  - type: Documentation
    url: https://docs.pixeltable.com/libraries/mcp
- aid: pixeltable-ask
  name: Pixeltable Ask API (NLWeb)
  description: 'NLWeb natural-language question-answering endpoint. POST a JSON body containing a non-empty
    `query` to receive grounded answers with schema.org-typed source results; supports SSE streaming. Answered
    anonymously when probed. The provider documents a limit of 20 requests per minute per IP.'
  humanURL: https://pixeltable.com/llms.txt
  baseURL: https://pixeltable.com/ask
  tags:
  - NLWeb
  - Natural Language Query
  - Agent Interface
  properties:
  - type: RateLimits
    url: rate-limits/pixeltable-rate-limits.yml
  - type: ErrorCatalog
    url: errors/pixeltable-problem-types.yml
- aid: pixeltable-cloud-control-plane
  name: Pixeltable Cloud Control Plane API
  description: 'The authenticated HTTP API behind the Pixeltable Cloud dashboard and the `pxt` CLI. The
    provider publishes the base URL https://internal-api.pixeltable.com in /.well-known/agent.json and marks
    it authenticated_only, noting that a public OpenAPI is in development. Cloud API keys are sent as
    X-api-key; the control plane additionally requires a WorkOS AuthKit session. Anonymous probes of the host
    returned HTTP 500 on every path and /api/v1 on the apex host returned 401 no_session_cookie_provided, so
    no machine-readable contract could be read.'
  humanURL: https://pixeltable.com/developers/llms.txt
  baseURL: https://internal-api.pixeltable.com
  tags:
  - Cloud Control Plane
  - Authenticated API
  properties:
  - type: Authentication
    url: authentication/pixeltable-authentication.yml
