aid: pixeltable
name: Pixeltable
description: 'Pixeltable is an open-source (Apache 2.0) Python data infrastructure company building a unified
  multimodal backend for AI data applications. A single `pip install pixeltable` provides declarative storage,
  transformation, indexing, retrieval, serving and versioning of images, video, audio, documents and structured
  data through computed columns that run AI inference incrementally on insert, embedding indexes that stay in
  sync for vector search, Python UDFs and query functions, and built-in table history and revert. The same
  declarative schema runs locally via `pxt serve` or a FastAPI router and deploys to Pixeltable Cloud via
  `pxt deploy` for managed databases, R2-backed media buckets, Deploy endpoints and serverless scale-to-zero
  workers. Pixeltable integrates 25-plus AI providers including OpenAI, Anthropic, Gemini, Hugging Face,
  Bedrock, Groq, Mistral, Together, Fireworks, Ollama and Whisper, and positions itself as a replacement for
  the glue between object storage, Postgres, a vector database, an orchestrator and a framework such as
  LangChain. The company is unusually agent-forward: it publishes an A2A agent card, a callable read-only
  WebMCP server, an NLWeb ask endpoint, an installable Agent Skill, markdown representations of its pages, and
  scoped llms.txt context files. A public REST API with OpenAPI and scoped OAuth is stated as in active
  development.'
