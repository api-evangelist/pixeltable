x-contract-discovery:
  date: '2026-08-17'
  openapi: none
  detail: 'STEP 0b ran in full and found no REST contract. https://pixeltable.com/openapi.json returns HTTP 200
    but its body is an honest placeholder — {"status":"planned","message":"Public Pixeltable Cloud REST API
    OpenAPI spec is in active development."}. /openapi.yaml, /swagger.json, /v1/openapi.json, /api-docs, /docs
    and /redoc were probed on the apex, docs and internal-api hosts with no hit. GraphQL introspection found no
    endpoint. What the provider DOES publish is a live MCP server (anonymous tools/list returns real
    inputSchemas) and a conformant A2A agent card, so the machine-readable contract here is MCP, not OpenAPI.
    No tool crosswalk was emitted because there is no OpenAPI to bind tools to.'
  probes:
  - url: https://pixeltable.com/openapi.json
    status: 200
    result: placeholder-not-a-spec
  - url: https://docs.pixeltable.com/openapi.json
    status: 404
  - url: https://internal-api.pixeltable.com/openapi.json
    status: 500
  - url: https://pixeltable.com/graphql
    status: 404
  - url: https://pixeltable.com/mcp
    status: 200
    result: tools/list returned 2 tools with inputSchema
  - url: https://www.pixeltable.com/.well-known/agent-card.json
    status: 200
    result: conformant A2A agent card
